name: spotcrate

services:
  spotcrate:
    image: pjmeca/spotcrate:edge
    build: ./SpotCrate
    container_name: spotcrate
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./Music:/music
      - ./tracking.yaml:/app/tracking.yaml
      - ./app/cache:/app/cache
      - ./app/logs:/app/logs
    environment:
      TZ: Europe/Madrid
      CRON_SCHEDULE: "0 0 * * *"
      CLIENT__ID: "" # Required
      CLIENT__SECRET: "" # Required
      FORMAT: "opus" # Music format. Must be compatible with spotdl. Defaults to "opus".
      OPTIONS: "" # Additional spotdl options.
      YT_DLP_UPDATE_POLICY: "before-run" # before-run, never, or a fixed yt-dlp version like 2026.03.17
